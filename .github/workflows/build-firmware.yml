name: Build AI-Passport Real BIN Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build Firmware with ESP-IDF
        run: |
          . /opt/esp/idf/export.sh
          idf.py set-target esp32c3
          idf.py build

      - name: Merge Binaries into Single Factory Image
        run: |
          . /opt/esp/idf/export.sh
          esptool.py --chip esp32c3 merge_bin -o build/ai_passport_vape_factory_merged.bin --fill-flash-size 8MB 0x0 build/bootloader/bootloader.bin 0x8000 build/partition_table/partition-table.bin 0x10000 build/ai_passport_vape_firmware.bin

      - name: Upload Flashable BIN Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-passport-vape-firmware-bins
          path: |
            build/ai_passport_vape_factory_merged.bin
            build/ai_passport_vape_firmware.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
